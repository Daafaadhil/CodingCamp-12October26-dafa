<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Life Dashboard</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="dashboard">
      <!-- Header with Greeting and Time -->
      <header class="header">
        <div class="greeting-section">
          <h1 id="greeting">Good Morning</h1>
          <p id="userName"></p>
        </div>
        <div class="time-section">
          <div class="time" id="currentTime">00:00:00</div>
          <div class="date" id="currentDate">Monday, January 1, 2024</div>
        </div>
        <div class="controls">
          <button id="editNameBtn" class="btn-icon" title="Edit Name">✏️</button>
          <button id="themeToggle" class="btn-icon" title="Toggle Theme">🌙</button>
        </div>
      </header>

      <!-- Main Content Grid -->
      <main class="main-content">
        <!-- Focus Timer Section -->
        <section class="card timer-section">
          <h2>⏱️ Focus Timer</h2>
          <div class="timer-selector">
            <label for="timerDuration">Select Duration:</label>
            <select id="timerDuration" class="timer-dropdown">
              <option value="5">5 minutes</option>
              <option value="15">15 minutes</option>
              <option value="30">30 minutes</option>
              <option value="45">45 minutes</option>
              <option value="60">60 minutes</option>
            </select>
          </div>
          <div class="timer-display"><span id="timerMinutes">05</span>:<span id="timerSeconds">00</span></div>
          <div class="timer-controls">
            <button id="startTimer" class="btn btn-primary">Start</button>
            <button id="stopTimer" class="btn btn-secondary">Stop</button>
            <button id="resetTimer" class="btn btn-outline">Reset</button>
          </div>
        </section>

        <!-- To-Do List Section -->
        <section class="card todo-section">
          <h2>📋 To-Do List</h2>
          <div class="todo-input">
            <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="100" />
            <button id="addTask" class="btn btn-primary">Add</button>
          </div>
          <div id="duplicateWarning" class="warning-message" style="display: none">⚠️ This task already exists!</div>
          <ul id="taskList" class="task-list"></ul>
        </section>

        <!-- Quick Links Section -->
        <section class="card links-section">
          <h2>🔗 Quick Links</h2>
          <div class="add-link-form">
            <input type="text" id="linkName" placeholder="Name" maxlength="30" />
            <input type="url" id="linkUrl" placeholder="https://example.com" />
            <button id="addLink" class="btn btn-primary">Add</button>
          </div>
          <div id="linksList" class="links-grid"></div>
        </section>
      </main>

      <!-- Footer -->
      <footer class="footer">
        <p>Made with | Daafaadhil</p>
      </footer>
    </div>

    <!-- Edit Name Modal -->
    <div id="nameModal" class="modal">
      <div class="modal-content">
        <h3>Enter Your Name</h3>
        <input type="text" id="nameInput" placeholder="Your name" maxlength="20" />
        <div class="modal-buttons">
          <button id="saveName" class="btn btn-primary">Save</button>
          <button id="closeModal" class="btn btn-outline">Cancel</button>
        </div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
